name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact_name: macos-arm64
            experimental: false
            dist_command: dist
            artifact_glob: |
              dist/*.dmg
              dist/*-mac.zip
              dist/*-mac.zip.blockmap
          - platform: windows-latest
            artifact_name: windows-x64
            experimental: true
            dist_command: dist:win
            artifact_glob: |
              dist/*.exe
              dist/*.blockmap
          - platform: ubuntu-22.04
            artifact_name: linux-x64
            experimental: true
            dist_command: dist
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            wireshark-common \
            xvfb

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-15'
        run: brew install --cask wireshark-app

      - name: Setup MSYS2
        if: matrix.platform == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:release-version -- "${{ github.ref_name }}"

      - name: Run AI harness tests
        run: npm run test:ai-harness

      - name: Install Playwright browser
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'macos-15'
        run: npx playwright install chromium

      - name: Run renderer E2E tests
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:e2e -- --workers=1

      - name: Run macOS renderer E2E tests
        if: matrix.platform == 'macos-15'
        run: npm run test:e2e -- --workers=1 e2e/tests/macos.spec.ts e2e/tests/chat-sidebar.spec.ts

      - name: Bundle sharkd (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run build:sharkd

      - name: Build sharkd from source (Windows)
        if: matrix.platform == 'windows-latest'
        shell: msys2 {0}
        run: |
          echo "=== Cloning Wireshark source ==="
          git clone --depth 1 --branch master https://gitlab.com/wireshark/wireshark.git /c/wireshark-src
          cd /c/wireshark-src

          echo "=== Installing Wireshark dependencies ==="
          tools/msys2-setup.sh --install-all --noconfirm

          echo "=== Building sharkd ==="
          mkdir build && cd build
          cmake -G Ninja \
            -DBUILD_wireshark=OFF \
            -DBUILD_tshark=OFF \
            -DBUILD_sharkd=ON \
            -DBUILD_dumpcap=OFF \
            -DBUILD_rawshark=OFF \
            -DBUILD_editcap=OFF \
            -DBUILD_capinfos=OFF \
            -DBUILD_mergecap=OFF \
            -DBUILD_reordercap=OFF \
            -DBUILD_text2pcap=OFF \
            -DBUILD_randpkt=OFF \
            -DENABLE_CCACHE=ON \
            ..
          ninja sharkd

      - name: Bundle sharkd (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $SharkdPaths = @(
            "C:\wireshark-src\build\run\sharkd.exe",
            "C:\wireshark-src\build\sharkd.exe"
          )

          $SharkdPath = $null
          foreach ($path in $SharkdPaths) {
            if (Test-Path $path) {
              $SharkdPath = $path
              break
            }
          }

          if (-not $SharkdPath) {
            Write-Error "sharkd.exe not found after build"
            exit 1
          }

          $WiresharkDir = Split-Path $SharkdPath
          powershell -ExecutionPolicy Bypass -File scripts/bundle-sharkd.ps1 `
            -SharkdPath $SharkdPath `
            -WiresharkDir $WiresharkDir

      - name: Validate bundled sharkd (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BundleDir = "resources/sharkd"
          $Sharkd = Join-Path $BundleDir "sharkd-x86_64-pc-windows-msvc.exe"

          if (-not (Test-Path $Sharkd)) {
            throw "Missing bundled sharkd executable: $Sharkd"
          }

          $ObjdumpCandidates = @(
            "C:\msys64\ucrt64\bin\objdump.exe",
            "D:\msys64\ucrt64\bin\objdump.exe",
            "$env:RUNNER_TEMP\..\msys64\ucrt64\bin\objdump.exe"
          )
          $Objdump = $ObjdumpCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Objdump) {
            $Objdump = (Get-Command objdump.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $Objdump) {
            throw "objdump not found at any known path"
          }
          Write-Host "Using objdump: $Objdump"

          $SystemDllRegex = '^(api-ms-win-|KERNEL32\.dll$|ADVAPI32\.dll$|IPHLPAPI\.dll$|SHELL32\.dll$|USER32\.dll$|OLE32\.dll$|OLEAUT32\.dll$|SECUR32\.dll$|CRYPT32\.dll$|BCRYPT\.dll$|WS2_32\.dll$|WSOCK32\.dll$|NTDLL\.dll$|UCRTBASE\.dll$|VCRUNTIME140(_1)?\.dll$|MSVCP140\.dll$)'
          $Imports = & $Objdump -p $Sharkd 2>$null |
            Select-String -Pattern '^\s*DLL Name:\s+(.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() } |
            Select-Object -Unique

          $Missing = @()
          foreach ($dll in $Imports) {
            if ($dll -match $SystemDllRegex) { continue }
            if (-not (Test-Path (Join-Path $BundleDir $dll))) {
              $Missing += $dll
            }
          }

          if ($Missing.Count -gt 0) {
            Write-Host "Missing imported DLLs:"
            $Missing | ForEach-Object { Write-Host "  - $_" }
            throw "Windows sharkd bundle validation failed"
          }

          & $Sharkd -v | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "sharkd smoke check failed with exit code $LASTEXITCODE"
          }

      - name: Build Electron app (macOS)
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.MAC_APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          umask 077
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey-build.p8"
          export APPLE_API_KEY
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          npm run ${{ matrix.dist_command }}

      - name: Build Electron app (experimental platform)
        if: matrix.platform != 'macos-15'
        run: npm run ${{ matrix.dist_command }}

      - name: Download packaged smoke capture
        run: npm run corpus:sync -- --ids dns-lookups

      - name: Run packaged smoke test
        run: >-
          npm run smoke:packaged --
          --capture test-results/public-pcaps/dns.cap
          --filter dns
          --timeout-ms 60000

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.MAC_APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          umask 077
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey-verify.p8"
          export APPLE_API_KEY
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          APP="dist/mac-arm64/PacketPilot.app"
          DMG=(dist/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun notarytool submit "${DMG[0]}" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "${DMG[0]}"
          xcrun stapler validate "${DMG[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG[0]}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packetpilot-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packetpilot-*
          merge-multiple: true
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PacketPilot ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-artifacts/**
          body: |
            ## PacketPilot ${{ github.ref_name }}

            AI-powered network packet analyzer.

            ### Downloads
            - **macOS (Apple Silicon)**: Download the `.dmg`. Install Wireshark first so PacketPilot can use its `sharkd` runtime.
            - **Windows**: Download the `.exe` installer.
            - **Linux**: Download the `.AppImage`, `.deb`, or `.tar.gz` build.

            ### What's New
            See the [changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
